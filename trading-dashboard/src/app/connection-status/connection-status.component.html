<div class="connection-status-container">
  <div class="servers-grid">
    <div
      *ngFor="let server of servers"
      class="server-status-item"
      [ngClass]="'status-' + server.status"
      [matTooltip]="getServerTooltip(server)"
      matTooltipPosition="below">

      <div class="server-icon-container">
        <img
          [src]="server.icon"
          [alt]="server.name + ' icon'"
          class="server-icon"
          [ngClass]="'icon-' + server.status">

        <div class="status-indicator" [ngClass]="'indicator-' + server.status">
          <div class="status-dot" [ngClass]="'dot-' + server.status"></div>
        </div>
      </div>

      <div class="server-label-wrapper">
        <div class="server-label">{{ server.name }}</div>
        <button
          *ngIf="server.name === 'MT5 API' && server.status === 'offline'"
          class="reconnect-btn"
          (click)="reconnectMT5()"
          [matTooltip]="'Attempt to reconnect to MT5 API'"
          matTooltipPosition="below">
          <span class="reconnect-icon">↻</span>
          Reconnect
        </button>
      </div>
    </div>
  </div>

  <!-- Overall status indicator -->
  <!-- <div class="overall-status" [ngClass]="'overall-' + getOverallStatus()">
    <div class="overall-dot" [ngClass]="'overall-dot-' + getOverallStatus()"></div>
  </div> -->
</div>
