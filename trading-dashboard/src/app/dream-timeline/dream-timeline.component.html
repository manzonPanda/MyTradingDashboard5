<!-- Dream Timeline with Magical Confetti Animation -->
<div class="dream-time-minimal" [ngClass]="{'anniversary-month': isAnniversaryMonth}">
  <!-- Magical Confetti Overlay -->
  <div class="confetti-container" *ngIf="showConfetti">
    <div class="confetti-piece" *ngFor="let i of [].constructor(25); let index = index"
         [style.animation-delay]="(index * 0.1) + 's'"
         [ngClass]="'confetti-' + ((index % 6) + 1)">
    </div>
    <div class="sparkle" *ngFor="let i of [].constructor(15); let index = index"
         [style.animation-delay]="(index * 0.15) + 's'"
         [style.left.%]="(index * 6.67)"
         [style.animation-duration]="(2 + (index % 3)) + 's'">
      ✨
    </div>
    <div class="floating-emoji" *ngFor="let emoji of ['🎉','🎊','🌟','💫','🎈','🎆','✨','🎁']; let index = index"
         [style.animation-delay]="(index * 0.3) + 's'"
         [style.left.%]="(index * 12.5)">
      {{ emoji }}
    </div>
  </div>

  <div class="time-units">
    <div class="start-date-horizontal">
      <div class="date-line">August 11, 2023</div>
      <div class="time-line">6:41am</div>
      <div class="anniversary-badge" *ngIf="isAnniversaryMonth">
        🎉 Anniversary Month! 🎉
      </div>
    </div>
    <div class="time-unit" *ngIf="timeElapsed.years > 0" title="Years of Dreams">
      <span class="value">{{ timeElapsed.years }}</span>
      <span class="label">years</span>
    </div>
    <div class="time-unit" *ngIf="timeElapsed.months > 0 || timeElapsed.years > 0" title="Months of Growth">
      <span class="value">{{ timeElapsed.months }}</span>
      <span class="label">months</span>
    </div>
    <div class="time-unit" title="Days of Dedication">
      <span class="value">{{ timeElapsed.days }}</span>
      <span class="label">days</span>
    </div>
  </div>
</div>
