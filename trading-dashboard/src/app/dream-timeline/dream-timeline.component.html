<!-- Minimal Dream Timeline - Just the Time -->
<div class="dream-time-minimal">
  <div class="time-units">
    <div class="time-unit" *ngIf="timeElapsed.years > 0">
      <span class="value">{{ timeElapsed.years }}</span>
      <span class="label">y</span>
    </div>
    <div class="time-unit" *ngIf="timeElapsed.months > 0 || timeElapsed.years > 0">
      <span class="value">{{ timeElapsed.months }}</span>
      <span class="label">m</span>
    </div>
    <div class="time-unit">
      <span class="value">{{ timeElapsed.days }}</span>
      <span class="label">d</span>
    </div>
    <div class="time-unit">
      <span class="value">{{ timeElapsed.hours }}</span>
      <span class="label">h</span>
    </div>
    <div class="time-unit">
      <span class="value">{{ timeElapsed.minutes }}</span>
      <span class="label">m</span>
    </div>
    <div class="time-unit pulse">
      <span class="value">{{ timeElapsed.seconds }}</span>
      <span class="label">s</span>
    </div>
  </div>
</div>
