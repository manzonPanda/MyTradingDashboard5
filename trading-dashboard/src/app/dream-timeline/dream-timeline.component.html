<!-- Dream Timeline with Magical Confetti Animation -->
<div class="dream-time-minimal" [class.anniversary-month]="isAnniversaryMonth">
  @if (profitTargetHit) {
    <div class="confetti-container">
      @for (piece of confettiPieces; track $index) {
        <div [class]="'confetti-piece confetti-' + (($index % 6) + 1) + ' confetti-delay-' + ($index + 1)"></div>
      }
    </div>
  }

  <div class="time-units">
    <div class="start-date-horizontal">
      <div class="date-line">August 11, 2023</div>
      <div class="time-line">6:41am</div>
      @if (isAnniversaryMonth) {
        <div class="anniversary-badge">Remember why you started</div>
      }
    </div>

    <section class="experience-duration" aria-label="Experience duration">
      <div class="time-unit years-spotlight" title="Years of Dreams">
        <span class="duration-reading">
          <span class="value">{{ timeElapsed.years }}</span>
          <span class="label">years</span>
        </span>
      </div>

      <div class="duration-details">
        <div class="time-unit time-unit--months" title="Months of Growth">
          <span class="value">{{ timeElapsed.months }}</span>
          <span class="label">mos.</span>
        </div>
        <div class="time-unit time-unit--days" title="Days of Dedication">
          <span class="value">{{ timeElapsed.days }}</span>
          <span class="label">days</span>
        </div>
      </div>
    </section>
  </div>
</div>
