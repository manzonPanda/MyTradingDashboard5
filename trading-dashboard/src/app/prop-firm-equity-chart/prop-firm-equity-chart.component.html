<div
  class="pf-equity-chart"
  [class.is-live]="isLive"
  [class.has-trades]="!hasNoTrades"
>
  <div #chartEl class="pf-chart-canvas"></div>

  <!-- Warrior performance overlay on the left side of the chart (replaces the
       static Goku image). Reacts to the LIVE OPEN-TRADE floating P&L percentage
       and never blocks chart interaction (pointer-events: none). -->
  <app-warrior-performance-overlay
    [performancePercent]="openTradePnlPercent"
  ></app-warrior-performance-overlay>


  <!-- Polished empty state -->
  <div class="pf-empty" *ngIf="!hasTrades">
    <div class="pf-empty-icon">
      <span class="pf-empty-ring"></span>
      <span class="pf-empty-core"></span>
    </div>
    <div class="pf-empty-title">No trades yet</div>
    <div class="pf-empty-sub">Your prop-firm equity curve will appear here once you open your first position.</div>
  </div>
</div>
