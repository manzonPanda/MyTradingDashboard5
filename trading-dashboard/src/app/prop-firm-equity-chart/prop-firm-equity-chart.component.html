<div
  class="pf-equity-chart"
  [class.is-live]="isLive"
  [class.has-trades]="!hasNoTrades"
>
  <div #chartEl class="pf-chart-canvas"></div>


  <!-- Account state chip -->
  <div class="pf-status" *ngIf="hasTrades">
    <div class="pf-status-chip" [class]="accountState">
      <span class="pf-status-dot"></span>
      <span class="pf-status-label">{{ stateLabel }}</span>
      <span class="pf-live-badge" *ngIf="isLive"><span class="pf-live-dot"></span>LIVE</span>
    </div>
  </div>

  <!-- Win / Loss / Open legend -->
  <div class="pf-legend" *ngIf="hasTrades">
    <span class="pf-legend-item"><i class="pf-dot win"></i>Win</span>
    <span class="pf-legend-item"><i class="pf-dot loss"></i>Loss</span>
    <span class="pf-legend-item" *ngIf="isLive"><i class="pf-dot open"></i>Open</span>
  </div>

  <!-- Polished empty state -->
  <div class="pf-empty" *ngIf="!hasTrades">
    <div class="pf-empty-icon">
      <span class="pf-empty-ring"></span>
      <span class="pf-empty-core"></span>
    </div>
    <div class="pf-empty-title">No trades yet</div>
    <div class="pf-empty-sub">Your prop-firm equity curve will appear here once you open your first position.</div>
  </div>
</div>
